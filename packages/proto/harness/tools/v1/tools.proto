syntax = "proto3";

package harness.tools.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

// ToolService — FeatureShipping 010 G1 / DETAILED_DESIGN_PLAN.md §8.1
//
// Completions relative to the §8.1 sketch:
// - Describe returns DescribeResponse (repeated ToolDescriptor) instead of a
//   single ToolDescriptor so the handshake can populate a registry.
// - Empty is google.protobuf.Empty rather than a local message.
// - ToolEvent, ToolDescriptor, HealthStatus were unnamed in §8.1 and are
//   filled in to match the G1 TypeScript bridge contract.
// Payload/result stay google.protobuf.Struct (no payload_json deviation).

service ToolService {
  rpc Execute(ToolRequest) returns (ToolResponse);
  rpc ExecuteStream(ToolRequest) returns (stream ToolEvent);
  rpc Describe(google.protobuf.Empty) returns (DescribeResponse);
  rpc Health(google.protobuf.Empty) returns (HealthStatus);
}

message ToolRequest {
  string tool_name = 1;
  string run_id = 2;
  string state_id = 3;
  map<string, string> args = 4;
  google.protobuf.Struct payload = 5;
  int64 timeout_ms = 6;
}

message ToolResponse {
  int32 exit_code = 1;
  string signal = 2;
  google.protobuf.Struct result = 3;
  string stderr = 4;
}

message ToolEvent {
  oneof kind {
    string log_line = 1;
    int32 progress_pct = 2;
    ToolResponse done = 3;
  }
}

message ToolDescriptor {
  string name = 1;
  string language = 2;
  google.protobuf.Struct arg_schema = 3;
  string description = 4;
}

message DescribeResponse {
  repeated ToolDescriptor tools = 1;
}

message HealthStatus {
  enum ServingStatus {
    SERVING_STATUS_UNSPECIFIED = 0;
    SERVING = 1;
    NOT_SERVING = 2;
  }
  ServingStatus status = 1;
}
